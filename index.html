
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>Zürich Shoreline Map</title>

    <!-- QGIS2WEB STYLESHEETS -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link rel="stylesheet" href="resources/photon-geocoder-autocomplete.min.css">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <!-- RESPONSIVE MAP STYLING -->
    <style>
        html, body {
            width: 100%;
            height: 100%;
            min-width: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            min-width: 0;
            margin: 0;
            padding: 0;
        }

        /* OpenLayers controls */

        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444444 !important;
            border-radius: 0px;
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder {
            color: #444444 !important;
        }

        .search-layer-input-search {
            background-color: #f8f8f8 !important;
        }

        .ol-control > *:focus,
        .ol-control > *:hover {
            background-color: rgba(248, 248, 248, 0.7) !important;
        }

        .ol-control {
            background-color: rgba(255, 255, 255, 0.4) !important;
            padding: 2px !important;
        }
    </style>

</head>

<body>

    <!-- MAP CONTAINER -->
    <div id="map">

        <div id="popup" class="ol-popup">
            <a href="#"
               id="popup-closer"
               class="ol-popup-closer">
            </a>

            <div id="popup-content"></div>
        </div>

    </div>

    <!-- QGIS2WEB SCRIPTS -->

    <script src="resources/qgis2web_expressions.js"></script>

    <script src="./resources/functions.js"></script>

    <script src="./resources/ol.js"></script>

    <script src="./resources/ol-layerswitcher.js"></script>

    <script src="resources/photon-geocoder-autocomplete.min.js"></script>

    <script src="resources/olms.js"></script>

    <!-- MAP LAYERS -->

    <script src="layers/stadt_zurich_grenze_1.js"></script>
    <script src="layers/shoreline_valid_2.js"></script>
    <script src="layers/photos_3.js"></script>

    <!-- LAYER STYLES -->

    <script src="styles/stadt_zurich_grenze_1_style.js"></script>
    <script src="styles/shoreline_valid_2_style.js"></script>
    <script src="styles/photos_3_style.js"></script>

    <!-- LAYER CONFIGURATION -->

    <script src="./layers/layers.js" type="text/javascript"></script>

    <script src="./resources/Autolinker.min.js"></script>

    <!-- INITIALIZE QGIS2WEB MAP -->

    <script src="./resources/qgis2web.js"></script>

    <!-- RESPONSIVE OPENLAYERS RESIZING -->

    <script>
    (function() {

        function resizeMap() {

            if (typeof map !== 'undefined' && map) {

                map.updateSize();

            }

        }

        // Resize when page loads
        window.addEventListener('load', function() {
            resizeMap();

            setTimeout(resizeMap, 300);
            setTimeout(resizeMap, 1000);
        });

        // Resize when browser dimensions change
        window.addEventListener('resize', function() {
            resizeMap();
        });

        // Observe changes to map container dimensions
        if (typeof ResizeObserver !== 'undefined') {

            const mapElement = document.getElementById('map');

            const observer = new ResizeObserver(function() {
                resizeMap();
            });

            observer.observe(mapElement);

        }

    })();
    </script>

</body>
</html>
